name: CI - Apollo RCA Test & Security Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Generated branch-based GitHub Pages deployment is managed separately.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Run Test Suite (node --test)
        run: node --test

      - name: Verify Single-Source Model Invariant
        run: node --test ai-pipeline.test.mjs

      - name: Verify Local AI Daemon Bridge
        run: node --test local-ai-bridge.test.mjs

      - name: Verify End-to-End Workflow & Integrity
        run: node --test e2e-workflow.test.mjs

      - name: Verify Stress and Stability Suite
        run: node --test test/test-stress-stability.mjs
