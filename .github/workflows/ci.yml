name: CI - Apollo RCA Test & Security Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Generated branch-based GitHub Pages deployment is managed separately.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Run Test Suite (node --test)
        run: node --test

      - name: Verify Single-Source Model Invariant
        run: node --test ai-pipeline.test.mjs

      - name: Verify Local AI Daemon Bridge
        run: node --test local-ai-bridge.test.mjs

      - name: Verify End-to-End Workflow & Integrity
        run: node --test e2e-workflow.test.mjs

      - name: Verify Stress and Stability Suite
        run: node --test test/test-stress-stability.mjs
